name: lab07-clinical-stack

services:
  postgres:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Define POSTGRES_DB in .env}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:?Define POSTGRES_HOST_PORT in .env}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s

  adminer:
    image: adminer:4.8.1
    profiles:
      - dev
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "127.0.0.1:${ADMINER_PORT:?Define ADMINER_PORT in .env}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  jupyter:
    build:
      context: .
      dockerfile: Dockerfile.jupyter
    environment:
      DATABASE_URL: >-
        postgresql://${POSTGRES_USER:?Define POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:?Define POSTGRES_DB in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:?Define JUPYTER_TOKEN in .env}
    ports:
      - "127.0.0.1:${JUPYTER_PORT:?Define JUPYTER_PORT in .env}:8888"
    volumes:
      - ./notebooks:/workspace/notebooks
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - sh
      - -c
      - >-
        python /usr/local/bin/check_database.py &&
        exec jupyter lab
        --ip=0.0.0.0
        --port=8888
        --no-browser
        --allow-root
        --IdentityProvider.token="$${JUPYTER_TOKEN}"

volumes:
  postgres_data:
