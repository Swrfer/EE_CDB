repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: python -m ruff check
        language: system
        types: [python]

      - id: ruff-format
        name: ruff-format
        entry: python -m ruff format --check
        language: system
        types: [python]

      - id: mypy
        name: mypy
        entry: python -m mypy src/
        language: system
        pass_filenames: false
        always_run: true
