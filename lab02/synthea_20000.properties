# ==============================================================================
# Synthea: dataset de 20,000 pacientes del Laboratorio 02
# ==============================================================================

# Activar la exportación CSV
exporter.csv.export = true

# Desactivar otros formatos
exporter.fhir.export = false
exporter.hospital.fhir.export = false

# Exportar únicamente las tres tablas necesarias
exporter.csv.included_files = patients.csv,encounters.csv,observations.csv
exporter.csv.excluded_files =

# Evitar agregar resultados a ejecuciones anteriores
exporter.csv.append_mode = false
exporter.csv.folder_per_run = false

# Directorio de salida
exporter.baseDirectory = ./lab02/data/synthea_20000

# Historia clínica exportada
exporter.years_of_history = 10
